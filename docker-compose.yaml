services:
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile

    environment:
      SERVER_PORT: 8080
      APP_SCRAPPER_BASE_URL: http://scrapper:8081
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

    depends_on:
      scrapper:
        condition: service_healthy

    ports:
      - "8080:8080"

  scrapper:
    build:
      context: .
      dockerfile: scrapper/Dockerfile

    environment:
      SERVER_PORT: 8081
      APP_TELEGRAM_BOT_BASE_URL: http://bot:8080
      STACKOVERFLOW_KEY: ${STACKOVERFLOW_KEY}
      STACKOVERFLOW_ACCESS_KEY: ${STACKOVERFLOW_ACCESS_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}

      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${PROFILE}

    depends_on:
      liquibase:
        condition: service_completed_successfully
    ports:
      - "8081:8081"

    healthcheck:
      test: [ "CMD-SHELL","curl -f http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s


  liquibase:
    build:
      context: .
      dockerfile: migrations/Dockerfile

    volumes:
      - ./migrations:/liquibase/changelog
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - LIQUIBASE_COMMAND_USERNAME=${DB_USER}
      - LIQUIBASE_COMMAND_PASSWORD=${DB_PASSWORD}
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=changelog-master.xml
    command:
      - update
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.3-trixie
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  db_data:

