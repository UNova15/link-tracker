x-shared-env: &Kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
  APP_TOPIC_NAME: link-updates
  DLQ_TOPIC_NAME: link-updates-dlq

services:

  redis-insight:
    image: redis/redisinsight:3.4.2
    ports:
      - "5540:5540"
    depends_on:
      valkey-cluster-init:
        condition: service_completed_successfully

  cache-1:
    image: valkey/valkey:9.1.0-trixie
    command: valkey-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6371:6379"
    volumes:
      - cache-1:/data

  cache-2:
    image: valkey/valkey:9.1.0-trixie
    command: valkey-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6372:6379"
    volumes:
      - cache-2:/data

  cache-3:
    image: valkey/valkey:9.1.0-trixie
    command: valkey-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6373:6379"
    volumes:
      - cache-3:/data

  valkey-cluster-init:
    image: valkey/valkey:9.1.0-trixie
    depends_on:
      - cache-1
      - cache-2
      - cache-3
    command: >
      bash -c "echo 'yes' | valkey-cli --cluster create
      $$(getent hosts cache-1 | awk '{ print $$1 }'):6379
      $$(getent hosts cache-2 | awk '{ print $$1 }'):6379
      $$(getent hosts cache-3 | awk '{ print $$1 }'):6379
      --cluster-replicas 0"


  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.14
    ports:
      - "8085:8085"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092'
      CONFLUENT_SUPPORT_METRICS_ENABLE: 'false'
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  kafka-1:
    image: apache/kafka:4.3.0
    ports:
      - "9094:9094"
    user: "root"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LISTENERS: 'INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-1:9092,EXTERNAL://localhost:9094'

    volumes:
      - kafka-data-1:/tmp/kafka-logs

    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s


  kafka-2:
    image: apache/kafka:4.3.0
    ports:
      - "9095:9095"
    user: "root"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LISTENERS: 'INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9095'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-2:9092,EXTERNAL://localhost:9095'
    volumes:
      - kafka-data-2:/tmp/kafka-logs

    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s


  kafka-3:
    image: apache/kafka:4.3.0
    ports:
      - "9096:9096"
    user: "root"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LISTENERS: 'INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9096'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-3:9092,EXTERNAL://localhost:9096'
    volumes:
      - kafka-data-3:/tmp/kafka-logs

    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    environment:
      <<: *Kafka
      SERVER_PORT: 8080
      APP_SCRAPPER_BASE_URL: http://scrapper:8081
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    ports:
      - "8080:8080"
    depends_on:
      scrapper:
        condition: service_healthy


  scrapper:
    build:
      context: .
      dockerfile: scrapper/Dockerfile

    environment:
      TZ: UTC
      <<: *Kafka
      SERVER_PORT: 8081
      REPLICA_FACTOR: 3
      PARTITION_FACTOR: 3

      CACHE_CLUSTER_NODES: cache-1:6379,cache-2:6379,cache-3:6379

      APP_TELEGRAM_BOT_BASE_URL: http://bot:8080
      SCHEMA_REGISTRY_URL: http://schema-registry:8081

      STACKOVERFLOW_KEY: ${STACKOVERFLOW_KEY}
      STACKOVERFLOW_ACCESS_KEY: ${STACKOVERFLOW_ACCESS_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}

      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

    depends_on:
      liquibase:
        condition: service_completed_successfully
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8081:8081"

    healthcheck:
      test: [ "CMD-SHELL","curl -f http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s


  liquibase:
    build:
      context: .
      dockerfile: migrations/Dockerfile

    volumes:
      - ./migrations:/liquibase/changelog
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - LIQUIBASE_COMMAND_USERNAME=${DB_USER}
      - LIQUIBASE_COMMAND_PASSWORD=${DB_PASSWORD}
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=changelog-master.xml
    command:
      - update
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.3-trixie
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  db_data:
  kafka-data-1:
  kafka-data-2:
  kafka-data-3:
  cache-1:
  cache-2:
  cache-3:

