server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bot

  data:
    redis:
      cluster:
        nodes: ${CACHE_CLUSTER_NODES:localhost:6371,localhost:6372,localhost:6373}
      connect-timeout: 2s


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: telegram-bot-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        specific.avro.reader: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

logging:
  file:
    name: bot/log/application.log
  structured:
    format:
      file: ecs

app:
  retryable-statuses: 500, 501, 502, 503, 504

  cache:
    rate-limiter:
      max-size: 10000
      ttl: 1h
    idempotency-key:
      max-size: 10000
      ttl: 24h

  kafka:
    topic-name: ${PROCESSED_UPDATES_TOPIC_NAME:link-updates}
    dlq-topic-name: ${DLQ_TOPIC_NAME:dlq-link-updates}
    retries: 3
    timeout-ms: 6000

  telegram:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_BOT_TOKEN}
    update-listener-sleep: 1s
    connection-timeout: 5s
    write-timeout: 75s
    read-timeout: 75s
    debug: false

  scrapper:
    base-url: ${APP_SCRAPPER_BASE_URL:https://scrapper:8081}
    connection-timeout: 1s
    response-timeout: 2s

resilience4j:
  retry:
    instances:
      scrapper:
        max-attempts: 2
        wait-duration: 1s

      telegram:
        max-attempts: 2
        wait-duration: 1s
  ratelimiter:
    configs:
      ip-limit:
        limit-for-period: 5
        limit-refresh-period: 10s
        timeout-duration: 0
  circuitbreaker:
    instances:
      scrapper:
        sliding-window-type: count_based
        sliding-window-size: 20
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s
      telegram:
        sliding-window-type: count_based
        sliding-window-size: 20
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s
