server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: scrapper

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 2
    properties:
      spring.json.add.type.headers: false
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      jdbc:
        batch_size: ${app.batch-size}
        order_inserts: true
        order_updates: true
  data:
    redis:
      cluster:
        nodes: ${CACHE_CLUSTER_NODES:localhost:6371,localhost:6372,localhost:6373}


logging:
  file:
    name: scrapper/log/application.log
  structured:
    format:
      file: ecs

app:
  sender: mq
  db-provider: orm

  kafka:
    topic-name: ${APP_TOPIC_NAME}
    replicas: ${REPLICA_FACTOR}
    partitions: ${PARTITION_FACTOR}
  http:
    base-url: ${APP_TELEGRAM_BOT_BASE_URL:https://bot:8080}

  check-link-interval: 3000
  check-outbox-interval: 1000
  age-of-links: 6000
  batch-size: 100
  number-of-threads: 4
  cache-ttl: 36000
  max-size-local-cache: 10000

  stackoverflow:
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
    base-url: https://api.stackexchange.com

  github:
    token: ${GITHUB_TOKEN}
    base-url: https://api.github.com
