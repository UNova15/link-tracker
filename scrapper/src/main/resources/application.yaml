server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  application:
    name: scrapper

logging:
  file:
    name: scrapper/log/application.log
  structured:
    format:
      file: ecs

app:
  scheduler-interval: 3000
  age-of-links: 6000

  batch-size: 100
  number-of-threads: 4

  stackoverflow:
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
    base-url: https://api.stackexchange.com

  github:
    token: ${GITHUB_TOKEN}
    base-url: https://api.github.com

  telegram-bot:
    base-url: ${APP_TELEGRAM_BOT_BASE_URL:http://bot:8080}


