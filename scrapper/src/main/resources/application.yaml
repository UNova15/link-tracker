server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: scrapper

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 2
    properties:
      spring.json.add.type.headers: false
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      jdbc:
        batch_size: ${app.batch-size}
        order_inserts: true
        order_updates: true
  data:
    redis:
      cluster:
        nodes: ${CACHE_CLUSTER_NODES:localhost:6371,localhost:6372,localhost:6373}


logging:
  file:
    name: scrapper/log/application.log
  structured:
    format:
      file: ecs

app:
  db-provider: orm
  retryable-statuses: 500,502,503,504

  kafka:
    topic-name: ${APP_TOPIC_NAME:link-updates}
    replicas: ${REPLICA_FACTOR:1}
    partitions: ${PARTITION_FACTOR:1}
    dlq-topic-name: ${DLQ_TOPIC_NAME:link-updates-dlq}

  scrapper-settings:
    check-link-interval: 3000
    check-outbox-interval: 1000
    age-of-links: 6000
    number-of-threads: 4
    batch-size: 100

  cache:
    valkey:
      ttl: 10
      max-size: 10000
    rate-limiter:
      ttl: 1
      max-size: 10000



  bot:
    base-url: ${APP_TELEGRAM_BOT_BASE_URL:https://bot:8080}
    connection-timeout: 500
    response-timeout: 100

  stackoverflow:
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
    base-url: https://api.stackexchange.com
    connection-timeout: 500
    response-timeout: 100

  github:
    token: ${GITHUB_TOKEN}
    base-url: https://api.github.com
    connection-timeout: 500
    response-timeout: 100


resilience4j:
  retry:
    instances:
      github:
        max-attempts: 2
        wait-duration: 1s

      stackoverflow:
        max-attempts: 2
        wait-duration: 1s

      bot:
        max-attempts: 2
        wait-duration: 1s

bucket4j:
  enabled: true
  filters:
    - cache-name: buckets
      filter-method: servlet
      filter-order: -1
      url: .*
      rate-limits:
        - cache-key: "getRemoteAddr()"
          bandwidths:
            - capacity: 50
              time: 10
              unit: seconds
      http-response-body: "{ \"error\": \"Too many requests\" }"


