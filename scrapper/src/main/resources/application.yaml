server:
  port: ${SERVER_PORT:8081}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.add.type.headers: false

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  application:
    name: scrapper

logging:
  file:
    name: scrapper/log/application.log
  structured:
    format:
      file: ecs

app:
  sender: ${MESSAGE_SENDER:mq}
  kafka:
      topic-name: ${APP_TOPIC_NAME}
      replicas: ${REPLICA_FACTOR}
      partitions: ${PARTITION_FACTOR}
  http:
    base-url: ${APP_TELEGRAM_BOT_BASE_URL:https://bot:8080}

  scheduler-interval: 3000
  age-of-links: 6000
  batch-size: 100
  number-of-threads: 4

  stackoverflow:
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
    base-url: https://api.stackexchange.com

  github:
    token: ${GITHUB_TOKEN}
    base-url: https://api.github.com
