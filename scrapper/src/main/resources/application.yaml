server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: scrapper

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 2
    properties:
      spring.json.add.type.headers: false
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      jdbc:
        batch_size: ${app.batch-size}
        order_inserts: true
        order_updates: true
  data:
    redis:
      cluster:
        nodes: ${CACHE_CLUSTER_NODES:localhost:6371,localhost:6372,localhost:6373}
      connect-timeout: 2s


logging:
  file:
    name: scrapper/log/application.log
  structured:
    format:
      file: ecs

app:
  db-provider: orm
  retryable-statuses: 500,502,503,504

  kafka:
    topic-name: ${RAW_UPDATES_TOPIC_NAME:link-updates}
    replicas: ${REPLICA_FACTOR:1}
    partitions: ${PARTITION_FACTOR:1}
    dlq-topic-name: ${DLQ_TOPIC_NAME:link-updates-dlq}
    timeout-seconds: 5

  scrapper-settings:
    check-link-interval: 5s
    check-outbox-interval: 1s
    age-of-links: 10s
    number-of-threads: 4
    batch-size: 100

  cache:
    ttl: 10h
    max-size: 10000

  bot:
    base-url: ${APP_TELEGRAM_BOT_BASE_URL:http://bot:8080}
    connection-timeout: 1s
    response-timeout: 1s

  stackoverflow:
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
    base-url: https://api.stackexchange.com
    connection-timeout: 1s
    response-timeout: 2s

  github:
    token: ${GITHUB_TOKEN}
    base-url: https://api.github.com
    connection-timeout: 1s
    response-timeout: 2s


resilience4j:
  retry:
    instances:
      github:
        max-attempts: 2
        wait-duration: 1s

      stackoverflow:
        max-attempts: 2
        wait-duration: 1s

      bot:
        max-attempts: 2
        wait-duration: 1s

      broker:
        max-attempts: 2
        wait-duration: 1s

  ratelimiter:
    configs:
      ip-limit:
        limit-for-period: 5
        limit-refresh-period: 10s
        timeout-duration: 0

  circuitbreaker:
    instances:
      github:
        sliding-window-type: count_based
        sliding-window-size: 20
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s

      stackoverflow:
        sliding-window-type: count_based
        sliding-window-size: 20
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s


      bot:
        sliding-window-type: count_based
        sliding-window-size: 20
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s

      broker:
        sliding-window-type: count_based
        sliding-window-size: 20
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s

