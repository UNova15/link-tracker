server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ai-agent

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: ai-agent
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        specific.avro.reader: true

    producer:
      acks: -1
      key-serializer: org.apache.kafka.common.serialization.StringDeserializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}



app:
  filter-config:
    stop-words:
      - spam
      - ads
      - promo
    excluded-authors:
      - bot-user
    min-length: 20

  ai-config:
    url: ${AI_URL:https://router.huggingface.co/v1/chat/completions}
    token: ${AI_TOKEN:test_token}
    model: "deepseek-ai/DeepSeek-V4-Pro:novita"
    threshold: 200
    query:
      prompt: "Summarize the following update in 2–3 sentences:\n\n"
      role: "user"

  kafka:
    raw-updates-topic: ${RAW_UPDATES_TOPIC_NAME:raw-updates}
    processed-updates-topic: ${PROCESSED_UPDATES_TOPIC_NAME:processed-updates }
    replicas: ${REPLICA_FACTOR:1}
    partitions: ${PARTITION_FACTOR:1}

